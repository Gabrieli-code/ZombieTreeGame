<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sobrevivência Zumbi</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🧟 Sobrevivência Zumbi</h1>

        <div id="question">
            Você deseja iniciar?
        </div>

        <div class="buttons">

            <button onclick="answer(true)">
                SIM
            </button>

            <button onclick="answer(false)">
                NÃO
            </button>

        </div>

        <button id="restart" onclick="restartGame()">
            Reiniciar
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
